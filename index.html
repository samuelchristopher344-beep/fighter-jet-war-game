<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fighter Jet War Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a12; color: #eee; font-family: system-ui, sans-serif; touch-action: none; }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 14px;
      text-shadow: 0 0 4px #000;
    }
    #weaponHud {
      position: absolute;
      top: 40px;
      left: 12px;
      pointer-events: none;
      font-size: 13px;
      color: #c9a84c;
      text-shadow: 0 0 3px #000;
    }
    #scoreHud {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      font-size: 16px;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }
    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50%;
    }
    #reticle::before, #reticle::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
    }
    #reticle::before { width: 2px; height: 20px; left: 50%; top: -10px; transform: translateX(-50%); }
    #reticle::after { width: 20px; height: 2px; top: 50%; left: -10px; transform: translateY(-50%); }
    #radar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 120px;
      height: 120px;
      background: rgba(0, 20, 0, 0.7);
      border: 2px solid #0f0;
      border-radius: 50%;
      pointer-events: none;
    }
    #radar canvas { width: 100%; height: 100%; }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      pointer-events: auto;
      display: grid;
      grid-template-columns: 60px 60px 60px;
      gap: 8px;
    }
    .btn {
      background: rgba(26,26,46,0.85);
      color: #c9a84c;
      border: 1px solid #c9a84c;
      border-radius: 10px;
      width: 60px;
      height: 50px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }
    .btn:active { background: #2a2a40; }
    #info {
      position: absolute;
      bottom: 90px;
      left: 12px;
      font-size: 11px;
      opacity: 0.75;
      pointer-events: none;
    }
    .lock { color: #ff4444; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <div>ALT: <span id="alt">5000</span> ft &nbsp; SPD: <span id="spd">420</span> kt</div>
    <div>View: <span id="viewName">External</span></div>
  </div>
  <div id="scoreHud">SCORE: <span id="score">0</span></div>
  <div id="weaponHud">
    GUN: <span id="gunAmmo">500</span> &nbsp;|&nbsp;
    MSL: <span id="mslCount">4</span> &nbsp;|&nbsp;
    <span id="lockStatus">No lock</span>
  </div>
  <div id="reticle"></div>
  <div id="radar"><canvas id="radarCanvas" width="120" height="120"></canvas></div>
  <div id="info">Use on-screen buttons or WASD / Arrows</div>
  <div id="controls">
    <div class="btn" id="btnUp">↑</div>
    <div class="btn" id="btnView">View</div>
    <div class="btn" id="btnGun">Gun</div>
    <div class="btn" id="btnLeft">←</div>
    <div class="btn" id="btnDown">↓</div>
    <div class="btn" id="btnRight">→</div>
    <div class="btn" id="btnMissile">MSL</div>
    <div class="btn" id="btnLock">Lock</div>
    <div class="btn" id="btnThrottle">SPD+</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a8cc0);
    scene.fog = new THREE.Fog(0x5a8cc0, 800, 6000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 15000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
    sun.position.set(400, 600, 200);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x3a5f3a, 0.6));

    // Terrain
    function createTerrain() {
      const size = 20000;
      const segments = 60;
      const geo = new THREE.PlaneGeometry(size, size, segments, segments);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getY(i);
        const height = Math.sin(x * 0.0008) * 80 + Math.sin(z * 0.0012) * 60 + Math.sin((x + z) * 0.0005) * 40;
        pos.setZ(i, height);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x4a7c4a }));
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      return mesh;
    }
    scene.add(createTerrain());

    for (let i = 0; i < 5; i++) {
      const water = new THREE.Mesh(
        new THREE.CircleGeometry(140 + Math.random() * 100, 16),
        new THREE.MeshLambertMaterial({ color: 0x2a6a8a, transparent: true, opacity: 0.8 })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.set((Math.random() - 0.5) * 7000, 5, (Math.random() - 0.5) * 7000);
      scene.add(water);
    }

    for (let i = 0; i < 16; i++) {
      const h = 100 + Math.random() * 200;
      const m = new THREE.Mesh(
        new THREE.ConeGeometry(60 + Math.random() * 80, h, 7),
        new THREE.MeshLambertMaterial({ color: 0x6b6b6b, flatShading: true })
      );
      m.position.set((Math.random() - 0.5) * 8000, h / 2, (Math.random() - 0.5) * 8000);
      m.castShadow = true;
      scene.add(m);
    }

    function createFighterJet(color = 0x5a6570, accent = 0x3a4148) {
      const jet = new THREE.Group();
      const metal = new THREE.MeshStandardMaterial({ color, metalness: 0.75, roughness: 0.22 });
      const dark = new THREE.MeshStandardMaterial({ color: accent, metalness: 0.55, roughness: 0.35 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x1a365d, transparent: true, opacity: 0.6, metalness: 0.85, roughness: 0.05 });

      const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.85, 10, 12), metal);
      fuse.rotation.z = Math.PI / 2;
      jet.add(fuse);

      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.4, 2.4, 10), metal);
      nose.rotation.z = -Math.PI / 2;
      nose.position.set(6.1, 0, 0);
      jet.add(nose);

      const wingGeo = new THREE.BoxGeometry(6.2, 0.14, 2.4);
      const leftWing = new THREE.Mesh(wingGeo, dark);
      leftWing.position.set(-0.8, 0, -2.0);
      leftWing.rotation.y = -0.22;
      jet.add(leftWing);
      const rightWing = leftWing.clone();
      rightWing.position.z = 2.0;
      rightWing.rotation.y = 0.22;
      jet.add(rightWing);

      const vtail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.0, 1.6), dark);
      vtail.position.set(-4.6, 1.2, 0);
      jet.add(vtail);

      const htail = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.12, 0.7), dark);
      htail.position.set(-4.4, 0.35, -1.3);
      jet.add(htail);
      const htail2 = htail.clone();
      htail2.position.z = 1.3;
      jet.add(htail2);

      const canopy = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2.1),
        glass
      );
      canopy.position.set(2.4, 0.6, 0);
      canopy.rotation.z = Math.PI / 2;
      jet.add(canopy);

      const exhaust1 = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 }));
      exhaust1.rotation.z = Math.PI / 2;
      exhaust1.position.set(-5.0, 0, -0.45);
      jet.add(exhaust1);
      const exhaust2 = exhaust1.clone();
      exhaust2.position.z = 0.45;
      jet.add(exhaust2);

      const glow1 = new THREE.PointLight(0xff5500, 2, 10);
      glow1.position.set(-5.4, 0, -0.45);
      jet.add(glow1);
      const glow2 = new THREE.PointLight(0xff5500, 2, 10);
      glow2.position.set(-5.4, 0, 0.45);
      jet.add(glow2);

      return jet;
    }

    const jet = createFighterJet();
    jet.position.set(0, 180, 0);
    scene.add(jet);

    const enemies = [];
    function createEnemy(x, y, z) {
      const e = createFighterJet(0x8b0000, 0x5a0000);
      e.position.set(x, y, z);
      e.userData = { health: 100, speed: 0.5 + Math.random() * 0.3 };
      scene.add(e);
      enemies.push(e);
      return e;
    }
    createEnemy(300, 250, 200);
    createEnemy(-400, 180, -300);
    createEnemy(100, 300, -500);

    const explosions = [];
    function createExplosion(pos) {
      const group = new THREE.Group();
      group.position.copy(pos);
      for (let i = 0; i < 12; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.5 + Math.random() * 0.6, 6, 6),
          new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00 })
        );
        p.userData = {
          vel: new THREE.Vector3((Math.random() - 0.5) * 5, Math.random() * 4, (Math.random() - 0.5) * 5),
          life: 28 + Math.random() * 16
        };
        group.add(p);
      }
      scene.add(group);
      explosions.push(group);
    }

    const bullets = [];
    const missiles = [];
    let gunAmmo = 500;
    let missileCount = 4;
    let lockedTarget = null;
    let lockIndex = 0;
    let score = 0;
    let throttle = 1.2;

    function updateHud() {
      document.getElementById('gunAmmo').textContent = gunAmmo;
      document.getElementById('mslCount').textContent = missileCount;
      document.getElementById('score').textContent = score;
      const lockEl = document.getElementById('lockStatus');
      if (lockedTarget) {
        lockEl.textContent = 'LOCK';
        lockEl.className = 'lock';
      } else {
        lockEl.textContent = 'No lock';
        lockEl.className = '';
      }
    }
    updateHud();

    function fireGun() {
      if (gunAmmo <= 0) return;
      gunAmmo--;
      updateHud();
      const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
      const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
      bullet.position.copy(jet.position).add(dir.clone().multiplyScalar(6));
      bullet.userData = { velocity: dir.multiplyScalar(9), life: 70 };
      scene.add(bullet);
      bullets.push(bullet);
    }

    function fireMissile() {
      if (missileCount <= 0) return;
      missileCount--;
      updateHud();
      const msl = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 2.4, 6), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.7 }));
      msl.rotation.z = Math.PI / 2;
      const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
      msl.position.copy(jet.position).add(dir.clone().multiplyScalar(6));
      msl.userData = { velocity: dir.clone().multiplyScalar(2.8), target: lockedTarget, life: 280 };
      scene.add(msl);
      missiles.push(msl);
    }

    function cycleLock() {
      if (enemies.length === 0) {
        lockedTarget = null;
        updateHud();
        return;
      }
      lockIndex = (lockIndex + 1) % enemies.length;
      lockedTarget = enemies[lockIndex];
      updateHud();
    }

    function destroyEnemy(e) {
      createExplosion(e.position);
      scene.remove(e);
      const idx = enemies.indexOf(e);
      if (idx >= 0) enemies.splice(idx, 1);
      score += 100;
      if (lockedTarget === e) lockedTarget = null;
      updateHud();
      setTimeout(() => {
        createEnemy((Math.random() - 0.5) * 2000, 150 + Math.random() * 200, (Math.random() - 0.5) * 2000);
      }, 3000);
    }

    const radarCtx = document.getElementById('radarCanvas').getContext('2d');
    function drawRadar() {
      const c = radarCtx;
      const s = 120;
      c.clearRect(0, 0, s, s);
      c.strokeStyle = '#0f0';
      c.lineWidth = 1;
      c.beginPath();
      c.arc(s/2, s/2, s/2 - 2, 0, Math.PI * 2);
      c.stroke();
      c.fillStyle = '#0f0';
      c.fillRect(s/2 - 2, s/2 - 2, 4, 4);
      const range = 700;
      enemies.forEach(e => {
        const dx = (e.position.x - jet.position.x) / range * (s/2);
        const dz = (e.position.z - jet.position.z) / range * (s/2);
        const rx = s/2 + dx;
        const ry = s/2 + dz;
        if (rx > 4 && rx < s-4 && ry > 4 && ry < s-4) {
          c.fillStyle = '#f44';
          c.beginPath();
          c.arc(rx, ry, 3, 0, Math.PI * 2);
          c.fill();
        }
      });
    }

    let cockpitView = false;
    const viewName = document.getElementById('viewName');

    function updateView() {
      if (cockpitView) {
        camera.position.set(2.6, 0.75, 0);
        camera.rotation.set(0, 0, 0);
        jet.add(camera);
        viewName.textContent = 'Cockpit';
      } else {
        scene.add(camera);
        viewName.textContent = 'External';
      }
    }
    updateView();

    // Controls state
    const input = { pitch: 0, yaw: 0, roll: 0, throttle: 0 };

    function bindHold(id, onDown, onUp) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); onDown(); };
      const end = (e) => { e.preventDefault(); onUp(); };
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointerleave', end);
      el.addEventListener('pointercancel', end);
    }

    bindHold('btnUp', () => input.pitch = 1, () => input.pitch = 0);
    bindHold('btnDown', () => input.pitch = -1, () => input.pitch = 0);
    bindHold('btnLeft', () => input.yaw = 1, () => input.yaw = 0);
    bindHold('btnRight', () => input.yaw = -1, () => input.yaw = 0);
    bindHold('btnThrottle', () => { throttle = Math.min(2.2, throttle + 0.15); }, () => {});

    document.getElementById('btnView').onclick = () => { cockpitView = !cockpitView; updateView(); };
    document.getElementById('btnGun').onclick = fireGun;
    document.getElementById('btnMissile').onclick = fireMissile;
    document.getElementById('btnLock').onclick = cycleLock;

    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'c') { cockpitView = !cockpitView; updateView(); }
      if (e.key === ' ') { e.preventDefault(); fireGun(); }
      if (e.key.toLowerCase() === 'm') fireMissile();
      if (e.key.toLowerCase() === 'l') cycleLock();
      if (e.key === ']') throttle = Math.min(2.2, throttle + 0.1);
      if (e.key === '[') throttle = Math.max(0.4, throttle - 0.1);
    });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    function animate() {
      requestAnimationFrame(animate);

      // Keyboard
      if (keys['w'] || keys['arrowup']) input.pitch = 1;
      else if (keys['s'] || keys['arrowdown']) input.pitch = -1;
      else if (!document.getElementById('btnUp').matches(':active') && !document.getElementById('btnDown').matches(':active')) input.pitch = 0;

      if (keys['a'] || keys['arrowleft']) input.yaw = 1;
      else if (keys['d'] || keys['arrowright']) input.yaw = -1;
      else if (!document.getElementById('btnLeft').matches(':active') && !document.getElementById('btnRight').matches(':active')) input.yaw = 0;

      // Apply rotation (more responsive)
      jet.rotateX(-input.pitch * 0.018);
      jet.rotateY(input.yaw * 0.025);
      jet.rotateZ(input.yaw * 0.012); // banking

      // Move forward
      const forward = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
      jet.position.add(forward.multiplyScalar(throttle));
      if (jet.position.y < 35) jet.position.y = 35;

      enemies.forEach(e => {
        if (!e.parent) return;
        const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(e.quaternion);
        e.position.add(dir.multiplyScalar(e.userData.speed));
        e.rotation.y += (Math.random() - 0.5) * 0.008;
        if (e.position.y < 40) e.position.y = 40;
      });

      for (let i = explosions.length - 1; i >= 0; i--) {
        const g = explosions[i];
        let alive = false;
        g.children.forEach(p => {
          if (p.userData.life > 0) {
            p.position.add(p.userData.vel);
            p.userData.vel.y -= 0.05;
            p.userData.life--;
            p.scale.multiplyScalar(0.97);
            alive = true;
          }
        });
        if (!alive) {
          scene.remove(g);
          explosions.splice(i, 1);
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.userData.velocity);
        b.userData.life--;
        if (b.userData.life <= 0) {
          scene.remove(b);
          bullets.splice(i, 1);
          continue;
        }
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (b.position.distanceTo(e.position) < 5) {
            e.userData.health -= 10;
            scene.remove(b);
            bullets.splice(i, 1);
            if (e.userData.health <= 0) destroyEnemy(e);
            break;
          }
        }
      }

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        if (m.userData.target && m.userData.target.parent) {
          const toTarget = m.userData.target.position.clone().sub(m.position).normalize();
          m.userData.velocity.lerp(toTarget.multiplyScalar(3.5), 0.04);
        }
        m.position.add(m.userData.velocity);
        m.lookAt(m.position.clone().add(m.userData.velocity));
        m.userData.life--;
        if (Math.random() > 0.65) {
          const smoke = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 4, 4),
            new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.5 })
          );
          smoke.position.copy(m.position);
          scene.add(smoke);
          setTimeout(() => scene.remove(smoke), 350);
        }
        if (m.userData.life <= 0) {
          scene.remove(m);
          missiles.splice(i, 1);
          continue;
        }
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (m.position.distanceTo(e.position) < 7) {
            destroyEnemy(e);
            scene.remove(m);
            missiles.splice(i, 1);
            break;
          }
        }
      }

      document.getElementById('alt').textContent = Math.round(jet.position.y * 10);
      document.getElementById('spd').textContent = Math.round(throttle * 320);
      drawRadar();

      if (!cockpitView) {
        const offset = new THREE.Vector3(-24, 8, 0).applyQuaternion(jet.quaternion);
        camera.position.copy(jet.position).add(offset);
        camera.lookAt(jet.position);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
