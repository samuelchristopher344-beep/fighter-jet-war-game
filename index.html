<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fighter Jet War Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a12; color: #eee; font-family: system-ui, sans-serif; }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 14px;
      text-shadow: 0 0 4px #000;
    }
    #weaponHud {
      position: absolute;
      top: 40px;
      left: 12px;
      pointer-events: none;
      font-size: 13px;
      color: #c9a84c;
      text-shadow: 0 0 3px #000;
    }
    #scoreHud {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      font-size: 16px;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }
    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50%;
    }
    #reticle::before, #reticle::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
    }
    #reticle::before { width: 2px; height: 20px; left: 50%; top: -10px; transform: translateX(-50%); }
    #reticle::after { width: 20px; height: 2px; top: 50%; left: -10px; transform: translateY(-50%); }
    #radar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 140px;
      height: 140px;
      background: rgba(0, 20, 0, 0.7);
      border: 2px solid #0f0;
      border-radius: 50%;
      pointer-events: none;
    }
    #radar canvas { width: 100%; height: 100%; }
    #controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }
    button {
      background: #1a1a2e;
      color: #c9a84c;
      border: 1px solid #c9a84c;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #2a2a40; }
    #info {
      position: absolute;
      bottom: 70px;
      left: 12px;
      font-size: 12px;
      opacity: 0.8;
    }
    .lock { color: #ff4444; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <div>ALT: <span id="alt">5000</span> ft &nbsp; SPD: <span id="spd">420</span> kt</div>
    <div>View: <span id="viewName">External</span></div>
  </div>
  <div id="scoreHud">SCORE: <span id="score">0</span></div>
  <div id="weaponHud">
    GUN: <span id="gunAmmo">500</span> &nbsp;|&nbsp;
    MSL: <span id="mslCount">4</span> &nbsp;|&nbsp;
    <span id="lockStatus">No lock</span>
  </div>
  <div id="reticle"></div>
  <div id="radar"><canvas id="radarCanvas" width="140" height="140"></canvas></div>
  <div id="info">WASD to fly &nbsp;|&nbsp; C view &nbsp;|&nbsp; Space = gun &nbsp;|&nbsp; M = missile &nbsp;|&nbsp; L = cycle lock</div>
  <div id="controls">
    <button id="toggleView">Switch to Cockpit View</button>
    <button id="fireGun">Fire Gun</button>
    <button id="fireMissile">Fire Missile</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a8cc0);
    scene.fog = new THREE.Fog(0x5a8cc0, 800, 6000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 15000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
    sun.position.set(400, 600, 200);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a5f3a, 0.6);
    scene.add(hemi);

    // Heightmapped terrain for "running ground" feel
    function createTerrain() {
      const size = 20000;
      const segments = 80;
      const geo = new THREE.PlaneGeometry(size, size, segments, segments);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getY(i); // plane is XY before rotation
        const height = 
          Math.sin(x * 0.0008) * 80 +
          Math.sin(z * 0.0012) * 60 +
          Math.sin((x + z) * 0.0005) * 40 +
          Math.sin(x * 0.003) * Math.cos(z * 0.002) * 25;
        pos.setZ(i, height);
      }
      geo.computeVertexNormals();
      const mat = new THREE.MeshLambertMaterial({
        color: 0x4a7c4a,
        flatShading: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      return mesh;
    }
    const terrain = createTerrain();
    scene.add(terrain);

    // Water patches on lower areas
    for (let i = 0; i < 6; i++) {
      const water = new THREE.Mesh(
        new THREE.CircleGeometry(150 + Math.random() * 120, 20),
        new THREE.MeshLambertMaterial({ color: 0x2a6a8a, transparent: true, opacity: 0.8 })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.set((Math.random() - 0.5) * 8000, 5, (Math.random() - 0.5) * 8000);
      scene.add(water);
    }

    // Mountains
    for (let i = 0; i < 20; i++) {
      const h = 120 + Math.random() * 220;
      const m = new THREE.Mesh(
        new THREE.ConeGeometry(70 + Math.random() * 90, h, 8),
        new THREE.MeshLambertMaterial({ color: 0x6b6b6b, flatShading: true })
      );
      m.position.set((Math.random() - 0.5) * 9000, h / 2, (Math.random() - 0.5) * 9000);
      m.castShadow = true;
      scene.add(m);
    }

    // Buildings
    for (let i = 0; i < 18; i++) {
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(25 + Math.random() * 35, 40 + Math.random() * 60, 25 + Math.random() * 35),
        new THREE.MeshLambertMaterial({ color: 0x888888 })
      );
      b.position.set((Math.random() - 0.5) * 6000, 25, (Math.random() - 0.5) * 6000);
      b.castShadow = true;
      scene.add(b);
    }

    // Improved fighter jet
    function createFighterJet(color = 0x5a6570, accent = 0x3a4148) {
      const jet = new THREE.Group();
      const metal = new THREE.MeshStandardMaterial({ color, metalness: 0.75, roughness: 0.22 });
      const dark = new THREE.MeshStandardMaterial({ color: accent, metalness: 0.55, roughness: 0.35 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x1a365d, transparent: true, opacity: 0.6, metalness: 0.85, roughness: 0.05 });

      // Fuselage
      const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.85, 10, 12), metal);
      fuse.rotation.z = Math.PI / 2;
      jet.add(fuse);

      // Nose
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.4, 2.4, 10), metal);
      nose.rotation.z = -Math.PI / 2;
      nose.position.set(6.1, 0, 0);
      jet.add(nose);

      // Wings (swept, thicker)
      const wingGeo = new THREE.BoxGeometry(6.2, 0.14, 2.4);
      const leftWing = new THREE.Mesh(wingGeo, dark);
      leftWing.position.set(-0.8, 0, -2.0);
      leftWing.rotation.y = -0.22;
      jet.add(leftWing);
      const rightWing = leftWing.clone();
      rightWing.position.z = 2.0;
      rightWing.rotation.y = 0.22;
      jet.add(rightWing);

      // Wing tips
      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.5, 0.35), dark);
      tip.position.set(-3.4, 0.25, -4.0);
      jet.add(tip);
      const tip2 = tip.clone();
      tip2.position.z = 4.0;
      jet.add(tip2);

      // Vertical tail
      const vtail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.0, 1.6), dark);
      vtail.position.set(-4.6, 1.2, 0);
      jet.add(vtail);

      // Horizontal tails
      const htail = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.12, 0.7), dark);
      htail.position.set(-4.4, 0.35, -1.3);
      jet.add(htail);
      const htail2 = htail.clone();
      htail2.position.z = 1.3;
      jet.add(htail2);

      // Canopy
      const canopy = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2.1),
        glass
      );
      canopy.position.set(2.4, 0.6, 0);
      canopy.rotation.z = Math.PI / 2;
      jet.add(canopy);

      // Twin exhausts
      const exhaustMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
      const exhaust1 = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 0.9, 8), exhaustMat);
      exhaust1.rotation.z = Math.PI / 2;
      exhaust1.position.set(-5.0, 0, -0.45);
      jet.add(exhaust1);
      const exhaust2 = exhaust1.clone();
      exhaust2.position.z = 0.45;
      jet.add(exhaust2);

      // Engine glow
      const glow1 = new THREE.PointLight(0xff5500, 2, 10);
      glow1.position.set(-5.4, 0, -0.45);
      jet.add(glow1);
      const glow2 = new THREE.PointLight(0xff5500, 2, 10);
      glow2.position.set(-5.4, 0, 0.45);
      jet.add(glow2);

      // Intake
      const intake = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.55, 0.9), dark);
      intake.position.set(1.8, -0.45, 0);
      jet.add(intake);

      return jet;
    }

    const jet = createFighterJet(0x5a6570, 0x3a4148);
    jet.position.set(0, 180, 0);
    scene.add(jet);

    const enemies = [];
    function createEnemy(x, y, z) {
      const e = createFighterJet(0x8b0000, 0x5a0000);
      e.position.set(x, y, z);
      e.userData = { health: 100, speed: 0.6 + Math.random() * 0.4 };
      scene.add(e);
      enemies.push(e);
      return e;
    }
    createEnemy(300, 250, 200);
    createEnemy(-400, 180, -300);
    createEnemy(100, 300, -500);
    createEnemy(600, 220, -200);

    // Explosions
    const explosions = [];
    function createExplosion(pos) {
      const group = new THREE.Group();
      group.position.copy(pos);
      for (let i = 0; i < 14; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.5 + Math.random() * 0.7, 6, 6),
          new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00 })
        );
        p.userData = {
          vel: new THREE.Vector3((Math.random() - 0.5) * 5, Math.random() * 4, (Math.random() - 0.5) * 5),
          life: 30 + Math.random() * 20
        };
        group.add(p);
      }
      scene.add(group);
      explosions.push(group);
    }

    // Weapons
    const bullets = [];
    const missiles = [];
    let gunAmmo = 500;
    let missileCount = 4;
    let lockedTarget = null;
    let lockIndex = 0;
    let score = 0;

    function updateWeaponHud() {
      document.getElementById('gunAmmo').textContent = gunAmmo;
      document.getElementById('mslCount').textContent = missileCount;
      document.getElementById('score').textContent = score;
      const lockEl = document.getElementById('lockStatus');
      if (lockedTarget) {
        lockEl.textContent = 'LOCK';
        lockEl.className = 'lock';
      } else {
        lockEl.textContent = 'No lock';
        lockEl.className = '';
      }
    }
    updateWeaponHud();

    function fireGun() {
      if (gunAmmo <= 0) return;
      gunAmmo--;
      updateWeaponHud();
      const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
      );
      const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
      bullet.position.copy(jet.position).add(dir.clone().multiplyScalar(6));
      bullet.userData = { velocity: dir.multiplyScalar(8), life: 80 };
      scene.add(bullet);
      bullets.push(bullet);
    }

    function fireMissile() {
      if (missileCount <= 0) return;
      missileCount--;
      updateWeaponHud();
      const msl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.2, 2.4, 6),
        new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.7 })
      );
      msl.rotation.z = Math.PI / 2;
      const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
      msl.position.copy(jet.position).add(dir.clone().multiplyScalar(6));
      msl.userData = {
        velocity: dir.clone().multiplyScalar(2.5),
        target: lockedTarget,
        life: 300
      };
      scene.add(msl);
      missiles.push(msl);
    }

    function cycleLock() {
      if (enemies.length === 0) {
        lockedTarget = null;
        updateWeaponHud();
        return;
      }
      lockIndex = (lockIndex + 1) % enemies.length;
      lockedTarget = enemies[lockIndex];
      updateWeaponHud();
    }

    function destroyEnemy(e) {
      createExplosion(e.position);
      scene.remove(e);
      const idx = enemies.indexOf(e);
      if (idx >= 0) enemies.splice(idx, 1);
      score += 100;
      if (lockedTarget === e) {
        lockedTarget = null;
      }
      updateWeaponHud();
      setTimeout(() => {
        createEnemy(
          (Math.random() - 0.5) * 2000,
          150 + Math.random() * 200,
          (Math.random() - 0.5) * 2000
        );
      }, 3000);
    }

    // Radar
    const radarCtx = document.getElementById('radarCanvas').getContext('2d');
    function drawRadar() {
      const c = radarCtx;
      const s = 140;
      c.clearRect(0, 0, s, s);
      c.strokeStyle = '#0f0';
      c.lineWidth = 1;
      c.beginPath();
      c.arc(s/2, s/2, s/2 - 2, 0, Math.PI * 2);
      c.stroke();
      c.beginPath();
      c.arc(s/2, s/2, s/4, 0, Math.PI * 2);
      c.stroke();

      c.fillStyle = '#0f0';
      c.fillRect(s/2 - 2, s/2 - 2, 4, 4);

      const range = 800;
      enemies.forEach(e => {
        const dx = (e.position.x - jet.position.x) / range * (s/2);
        const dz = (e.position.z - jet.position.z) / range * (s/2);
        const rx = s/2 + dx;
        const ry = s/2 + dz;
        if (rx > 4 && rx < s-4 && ry > 4 && ry < s-4) {
          c.fillStyle = '#f44';
          c.beginPath();
          c.arc(rx, ry, 3, 0, Math.PI * 2);
          c.fill();
        }
      });
    }

    // View
    let cockpitView = false;
    const viewName = document.getElementById('viewName');
    const toggleBtn = document.getElementById('toggleView');

    function updateView() {
      if (cockpitView) {
        camera.position.set(2.6, 0.75, 0);
        camera.rotation.set(0, 0, 0);
        jet.add(camera);
        viewName.textContent = 'Cockpit';
        toggleBtn.textContent = 'Switch to External View';
      } else {
        scene.add(camera);
        viewName.textContent = 'External';
        toggleBtn.textContent = 'Switch to Cockpit View';
      }
    }
    updateView();

    toggleBtn.onclick = () => { cockpitView = !cockpitView; updateView(); };
    document.getElementById('fireGun').onclick = fireGun;
    document.getElementById('fireMissile').onclick = fireMissile;

    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'c') { cockpitView = !cockpitView; updateView(); }
      if (e.key === ' ') { e.preventDefault(); fireGun(); }
      if (e.key.toLowerCase() === 'm') fireMissile();
      if (e.key.toLowerCase() === 'l') cycleLock();
    });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    const speed = 1.3;

    function animate() {
      requestAnimationFrame(animate);

      if (keys['w'] || keys['arrowup']) jet.rotation.x -= 0.008;
      if (keys['s'] || keys['arrowdown']) jet.rotation.x += 0.008;
      if (keys['a'] || keys['arrowleft']) jet.rotation.y += 0.012;
      if (keys['d'] || keys['arrowright']) jet.rotation.y -= 0.012;

      const forward = new THREE.Vector3(1, 0, 0).applyQuaternion(jet.quaternion);
      jet.position.add(forward.clone().multiplyScalar(speed));
      if (jet.position.y < 30) jet.position.y = 30;

      enemies.forEach(e => {
        if (!e.parent) return;
        const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(e.quaternion);
        e.position.add(dir.multiplyScalar(e.userData.speed));
        e.rotation.y += (Math.random() - 0.5) * 0.01;
        if (e.position.y < 40) e.position.y = 40;
      });

      // Explosions
      for (let i = explosions.length - 1; i >= 0; i--) {
        const g = explosions[i];
        let alive = false;
        g.children.forEach(p => {
          if (p.userData.life > 0) {
            p.position.add(p.userData.vel);
            p.userData.vel.y -= 0.05;
            p.userData.life--;
            p.scale.multiplyScalar(0.97);
            alive = true;
          }
        });
        if (!alive) {
          scene.remove(g);
          explosions.splice(i, 1);
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.userData.velocity);
        b.userData.life--;
        if (b.userData.life <= 0) {
          scene.remove(b);
          bullets.splice(i, 1);
          continue;
        }
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (b.position.distanceTo(e.position) < 5) {
            e.userData.health -= 10;
            scene.remove(b);
            bullets.splice(i, 1);
            if (e.userData.health <= 0) destroyEnemy(e);
            break;
          }
        }
      }

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        if (m.userData.target && m.userData.target.parent) {
          const toTarget = m.userData.target.position.clone().sub(m.position).normalize();
          m.userData.velocity.lerp(toTarget.multiplyScalar(3.5), 0.04);
        }
        m.position.add(m.userData.velocity);
        m.lookAt(m.position.clone().add(m.userData.velocity));
        m.userData.life--;

        if (Math.random() > 0.6) {
          const smoke = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 4, 4),
            new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.5 })
          );
          smoke.position.copy(m.position);
          scene.add(smoke);
          setTimeout(() => scene.remove(smoke), 400);
        }

        if (m.userData.life <= 0) {
          scene.remove(m);
          missiles.splice(i, 1);
          continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (m.position.distanceTo(e.position) < 7) {
            destroyEnemy(e);
            scene.remove(m);
            missiles.splice(i, 1);
            break;
          }
        }
      }

      document.getElementById('alt').textContent = Math.round(jet.position.y * 10);
      document.getElementById('spd').textContent = Math.round(speed * 350);
      drawRadar();

      if (!cockpitView) {
        const offset = new THREE.Vector3(-24, 8, 0).applyQuaternion(jet.quaternion);
        camera.position.copy(jet.position).add(offset);
        camera.lookAt(jet.position);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
