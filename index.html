<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sky Vanguard</title>
    <meta
      name="description"
      content="Sky Vanguard — twin-tail fighter combat with a glass HUD, a full cockpit, and a new airframe."
    />
    <meta name="theme-color" content="#071018" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23071018'/%3E%3Cpath d='M16 4 L28 24 L16 20 L4 24 Z' fill='%238fe06a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #071018;
        --panel: #121a22;
        --fg: #e7f2e4;
        --hud: #8fe06a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); }
      body { overflow: hidden; font-family: "Share Tech Mono", ui-monospace, monospace; }
      #stage { position: absolute; inset: 0; touch-action: none; }
      button { cursor: pointer; font: inherit; }
      #panel {
        pointer-events: none;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        padding: 16px;
      }
      #card {
        pointer-events: auto;
        width: min(100%, 28rem);
        border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent);
        background: color-mix(in srgb, var(--panel) 90%, transparent);
        backdrop-filter: blur(12px);
        padding: 20px 22px 22px;
      }
      .kicker { letter-spacing: 0.18em; color: var(--hud); font-size: 12px; margin: 0; }
      h1 {
        font-family: Rajdhani, "Avenir Next", sans-serif;
        font-size: 40px;
        line-height: 1;
        margin: 6px 0 0;
        font-weight: 700;
      }
      p { font-size: 14px; line-height: 1.5; color: color-mix(in srgb, var(--fg) 80%, transparent); }
      ul { padding: 0; margin: 12px 0 0; list-style: none; font-size: 12px; line-height: 1.6; color: color-mix(in srgb, var(--fg) 75%, transparent); }
      .row { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
      #start {
        min-height: 48px;
        background: var(--hud);
        color: var(--ink);
        border: 0;
        padding: 0 24px;
        font-family: Rajdhani, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      #score { font-size: 12px; color: color-mix(in srgb, var(--fg) 70%, transparent); }
      #touch {
        display: none;
        position: absolute;
        left: 0; right: 0; bottom: 0;
        justify-content: space-between;
        align-items: flex-end;
        padding: 12px;
        pointer-events: none;
      }
      #stick {
        pointer-events: auto;
        width: 112px; height: 112px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--hud) 50%, transparent);
        background: color-mix(in srgb, var(--ink) 50%, transparent);
      }
      .grid { pointer-events: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .grid button {
        min-height: 48px;
        min-width: 64px;
        border: 1px solid color-mix(in srgb, var(--hud) 60%, transparent);
        background: color-mix(in srgb, var(--ink) 70%, transparent);
        color: var(--hud);
        letter-spacing: 0.14em;
        font-size: 12px;
      }
      @media (min-width: 768px) {
        #panel { align-items: center; padding: 40px; }
      }
      @media (max-width: 767px) {
        #touch:not([hidden]) { display: flex; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
        <p id="hint" hidden style="position:absolute;top:16px;left:16px;right:16px;text-align:center;color:#8fe06a;letter-spacing:0.04em;font-size:14px;"></p>
    <div id="panel">
      <section id="card">
        <p class="kicker">SKY VANGUARD</p>
        <h1 id="title">Clear for takeoff</h1>
        <p>Walk out of the inn beside the runway, climb into the fighter, and rotate off the ground yourself.</p>
        <ul>
          <li>On foot: W forward · A D turn</li>
          <li>On the runway: Shift throttle · A D steer · W rotate</li>
          <li>Airborne: Space guns · F missile once LOCKED · V flares</li>
        </ul>
        <div class="row">
          <button id="start" type="button">Start</button>
          <p id="score">BEST 0</p>
        </div>
      </section>
    </div>
    <div id="touch" hidden>
      <div id="stick"></div>
      <div class="grid">
        <button id="burn" type="button">BURN</button>
        <button id="gun" type="button">GUN</button>
        <button id="msl" type="button">MSL</button>
        <button id="cam" type="button">CAM</button>
      </div>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
